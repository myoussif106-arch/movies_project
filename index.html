<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRIME WORLD | بوابتك لعالم الجريمة والغموض</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- شريط التنقل بأسلوب Netflix باسم الموقع الأصلي CRIME WORLD -->
  <header class="netflix-nav" id="mainNav">
    <div class="nav-left">
      <div class="brand-logo">
        <span class="logo-red">CRIME</span>
        <span class="logo-white">WORLD</span>
      </div>
      <nav class="nav-menu">
        <button class="nav-item active" onclick="filterContent('all', this)">الرئيسية</button>
        <button class="nav-item" onclick="filterContent('series', this)">المسلسلات</button>
        <button class="nav-item" onclick="filterContent('movie', this)">الأفلام</button>
        <button class="nav-item" onclick="filterContent('all', this)">الأكثر رواجاً</button>
      </nav>
    </div>

    <div class="nav-right">
      <button class="nav-icon-btn" title="بحث">🔍</button>
    </div>
  </header>

  <!-- البانر الرئيسي Hero -->
  <section class="netflix-hero" id="heroBanner">
    <div class="hero-vignette"></div>
    <div class="hero-bottom-fade"></div>
    
    <div class="hero-container">
      <div class="netflix-badge" id="heroBadge">
        <span class="badge-accent">CW</span> <span id="heroTypeLabel">عمل مميز</span>
      </div>
      <h1 class="hero-title" id="heroTitle">جاري التحميل...</h1>
      <div class="hero-meta" id="heroMeta">
        <span class="match-score">99% تطابق</span>
        <span class="quality-tag" id="heroQuality">HD</span>
        <span class="hero-likes-count" id="heroLikes">🔥 0 إعجاب</span>
      </div>
      <p class="hero-description" id="heroDesc">
        جاري جلب تفاصيل العمل الأكثر تصويتاً وإعجاباً...
      </p>
      <div class="hero-cta-buttons">
        <button class="btn-netflix-play" id="heroPlayBtn">
          <span class="play-icon">▶</span> تشغيل
        </button>
        <button class="btn-netflix-info" id="heroMoreInfoBtn">
          <span class="info-icon">ℹ</span> مزيد من المعلومات
        </button>
      </div>
    </div>
  </section>

  <!-- محتوى التصفح والصفوف -->
  <main class="netflix-content">
    <section class="netflix-row">
      <div class="row-header">
        <h2 class="row-title" id="rowCategoryTitle">الأعمال المميزة</h2>
        <div class="filter-pills">
          <button class="pill active" data-filter="all" onclick="filterContent('all', this)">الكل</button>
          <button class="pill" data-filter="movie" onclick="filterContent('movie', this)">الأفلام</button>
          <button class="pill" data-filter="series" onclick="filterContent('series', this)">المسلسلات</button>
        </div>
      </div>

      <div class="netflix-grid" id="moviesContainer">
        <!-- كروت الأفلام والمسلسلات تظهر هنا -->
      </div>
    </section>
  </main>

  <!-- نافذة تفاصيل العمل بأسلوب Netflix Modal (مع الحلقات للمسلسلات) -->
  <div class="detail-modal" id="detailModal">
    <div class="detail-backdrop" onclick="closeDetailModal()"></div>
    <div class="detail-card">
      <button class="detail-close-btn" onclick="closeDetailModal()">✕</button>
      
      <div class="detail-hero" id="modalHeroBg">
        <div class="detail-hero-gradient"></div>
        <div class="detail-hero-actions">
          <h2 class="detail-title" id="modalTitle">--</h2>
          <div class="detail-btns-row">
            <button class="btn-netflix-play" id="modalMainPlayBtn">
              <span>▶</span> تشغيل
            </button>
          </div>
        </div>
      </div>

      <div class="detail-body">
        <div class="detail-meta-row">
          <div class="meta-left">
            <span class="match-score">98% تطابق</span>
            <span class="quality-tag" id="modalBadge">HD</span>
            <span class="detail-genre-text" id="modalGenre">جريمة • غموض</span>
          </div>
        </div>

        <p class="detail-overview" id="modalDescription"></p>

        <!-- قائمة حلقات المسلسل -->
        <div class="episodes-section" id="episodesSection" style="display: none;">
          <div class="episodes-header">
            <h3>الحلقات</h3>
            <span class="season-label">الموسم 1</span>
          </div>
          <div class="episodes-netflix-list" id="episodesListContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- مشغل الفيديو السينمائي الكامل -->
  <div class="player-overlay" id="playerModal">
    <div class="player-container">
      <button class="player-back-btn" onclick="closePlayer()">➜ خروج من المشغل</button>
      <div class="video-embed-holder" id="videoEmbedHolder"></div>
    </div>
  </div>

  <!-- تذييل الصفحة -->
  <footer class="netflix-footer">
    <div class="brand-logo" style="justify-content: center; margin-bottom: 1rem;">
      <span class="logo-red">CRIME</span>
      <span class="logo-white">WORLD</span>
    </div>
    <p class="footer-note">منصة عربية متخصصة في أفلام ومسلسلات الجريمة والتحقيق والغموض.</p>
    <p class="footer-copy">© 2026 CRIME WORLD. جميع الحقوق محفوظة.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
